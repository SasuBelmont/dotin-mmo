services:
  # Servidor Backend WebSocket en Rust (Plan Free de Render)
  - type: web
    name: dotin-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: RUST_LOG
        value: info
